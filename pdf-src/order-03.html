<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="order.css" />
  <title>発注書</title>
</head>
<body>
  <article class="sheet">
    <header class="top">
      <span class="fax-mark">FAX</span>
      <h1>発注書</h1>
      <span class="date">発注日 2026年11月7日</span>
    </header>
    <div class="parties">
      <section>
        <p class="label">宛先</p>
        <p class="name">あおば青果（デモ） 御中</p>
        <p>FAX 000-000-0001</p>
      </section>
      <section>
        <p class="label">送信元</p>
        <p class="name">さくら保育園</p>
        <p>サンプル市緑町3-4-5</p>
        <p>TEL 000-000-0302 / FAX 000-000-0301</p>
      </section>
    </div>
    <p class="hope">納品希望日　<span>2026年11月11日</span></p>
    <table>
      <thead>
        <tr><th>品名</th><th>数量</th><th>単位</th><th>備考</th></tr>
      </thead>
      <tbody>
        <tr><td>きゅうり</td><td>4</td><td>kg</td><td></td></tr>
        <tr><td>トマト</td><td>3</td><td>kg</td><td></td></tr>
        <tr><td>レタス</td><td>2</td><td>玉</td><td></td></tr>
        <tr class="hand">
          <td class="ink">りんご</td>
          <td class="ink">5</td>
          <td>kg</td>
          <td class="ink">おやつ分</td>
        </tr>
        <tr class="blank"><td></td><td></td><td></td><td></td></tr>
        <tr class="blank"><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>
    <p class="closing">上記のとおり発注いたします。</p>
    <footer>この書類はデモ用の架空データです。実在の取引先・個人とは関係ありません。</footer>
  </article>
</body>
</html>
